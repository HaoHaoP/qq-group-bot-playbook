# 配额示例，复制为 budget.yaml 使用。单位：元（人民币）
daily_total: 1.00          # 全局每日硬预算
monthly_total: 25.00       # 全局每月硬预算，防单日突发

per_user:
  daily_yuan: 0.15         # 每人每日
  daily_calls: 20          # 每人每日调用次数上限

per_call:
  max_output_tokens: 300   # 单次输出上限
  max_input_tokens: 6000   # 单次输入上限（命中 + 未命中）

# 熔断阈值，按当日已用占 daily_total 的比例
circuit_breaker:
  tier1: 0.60              # 禁联网检索；上下文 8 → 6 条
  tier2: 0.80              # 上下文 → 4 条；摘要 300 → 150 字；只回 @；回复 ≤80 字
  tier3: 1.00              # 只回 @；回复 ≤40 字；禁贵模型；禁发图
  tier4: 1.20              # 静默，被 @ 只回固定话术

# 计价时段（北京时间）。高峰价为空闲价两倍
pricing:
  high_peak:
    weekdays: [1, 2, 3, 4, 5]
    windows: ["09:00-12:00", "14:00-18:00"]
    flash_yuan_per_million: {cache_hit: 0.04, cache_miss: 2.0, output: 8.0}
  off_peak:
    flash_yuan_per_million: {cache_hit: 0.02, cache_miss: 1.0, output: 4.0}
